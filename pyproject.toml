[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crucibix-platform"
version = "0.1.0"
description = "Shared FastAPI + hexagonal/DDD service template and platform libraries for Crucibix."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "PyJWT[crypto]>=2.9,<3.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crucibix_platform"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
